backend:
  name: turbo-github
  turbo_site_id: 42715493-8eca-4f1a-9a0e-5b246b53ca52
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "education"
    label: "Education"
    folder: "_education"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "YouTube ID", name: "youtube_id", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Excerpt", name: "excerpt_text", widget: "text" }
      - label: "Keywords"
        name: "keywords"
        widget: "list"
        field:
          label: "Keyword"
          name: "keyword"
          widget: "string"
      - { label: "Article Content", name: "body", widget: "markdown" }

  - name: "market_analysis"
    label: "Market Analysis"
    folder: "_market_analysis"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "YouTube ID", name: "youtube_id", widget: "string" }
      - { label: "Excerpt", name: "excerpt_text", widget: "text" }
      - label: "Assets"
        name: "assets"
        widget: "list"
      - label: "Keywords"
        name: "keywords"
        widget: "list"
        field:
          label: "Keyword"
          name: "keyword"
          widget: "string"
      - { label: "Article Content", name: "body", widget: "markdown" }

  - name: "indicators"
    label: "Indicators"
    folder: "_indicators"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Access", name: "access", widget: "select", options: ["FREE", "PREMIUM"], required: false }
      - label: "Keywords"
        name: "keywords"
        widget: "list"
        field:
          label: "Keyword"
          name: "keyword"
          widget: "string"
      - { label: "Preview Image", name: "image", widget: "image", required: false }
      - { label: "YouTube Video ID", name: "youtube_id", widget: "string", required: false }
      - { label: "TradingView URL", name: "tradingview_url", widget: "string", required: false }
      - { label: "Intro", name: "intro", widget: "text", required: false }
      - { label: "Layout", name: "layout", widget: "hidden", default: "indicator" }
      - { label: "Indicator Content", name: "body", widget: "markdown" }
