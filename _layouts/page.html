---
layout: default
---

<article class="education-article">
  <div class="education-article-container">

    <a href="{{ '/education/' | relative_url }}" class="education-back">
      ← Back to Education
    </a>

    <header class="education-article-header">
      <span class="education-eyebrow">CRYPTO4LIGHT EDUCATION</span>

      <h1>{{ page.title }}</h1>

      {% if page.date %}
        <time datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%B %d, %Y" }}
        </time>
      {% endif %}
    </header>

    {% if page.image %}
      <div class="education-article-image">
        <img
          src="{{ page.image | relative_url }}"
          alt="{{ page.title | escape }}"
        >
      </div>
    {% endif %}

    {% if page.excerpt_text %}
      <p class="education-article-intro">
        {{ page.excerpt_text }}
      </p>
    {% endif %}

    <div class="education-article-content">
      {{ content }}
    </div>

    <footer class="education-article-footer">
      <a href="{{ '/education/' | relative_url }}">
        ← Back to Education
      </a>
    </footer>

  </div>
</article>

<style>
.education-article {
  padding: 25px 20px 80px;
  background: transparent;
  min-height: 70vh;
}

.education-article-container {
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
}

.education-back {
  display: inline-block;
  color: #999;
  text-decoration: none;
  font-size: 14px;
  margin-bottom: 25px;
}

.education-back:hover {
  color: #fff;
}

.education-article-header {
  margin: 0 0 25px;
}

.education-eyebrow {
  color: #999;
  font-size: 12px;
  letter-spacing: 2px;
}

.education-article-header h1 {
  display: block;
  color: #fff;
  font-size: clamp(30px, 5vw, 42px);
  line-height: 1.2;
  margin: 14px 0;
}

.education-article-header time {
  color: #888;
  font-size: 14px;
}

.education-article-image {
  width: 100%;
  margin: 25px 0 30px;
  overflow: hidden;
  border-radius: 12px;
}

.education-article-image img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}

.education-article-intro {
  color: #bbb;
  font-size: 18px;
  line-height: 1.8;
  margin: 25px 0;
}

.education-article-content {
  color: #c8c8c8;
  font-size: 16px;
  line-height: 1.85;
}

.education-article-content h2 {
  color: #fff;
  font-size: 26px;
  line-height: 1.3;
  margin: 38px 0 16px;
}

.education-article-content h3 {
  color: #fff;
  font-size: 20px;
  margin: 28px 0 12px;
}

.education-article-content p {
  margin: 0 0 22px;
}

.education-article-content ul,
.education-article-content ol {
  padding-left: 25px;
  margin-bottom: 24px;
}

.education-article-content li {
  margin-bottom: 10px;
}

.education-article-content strong {
  color: #fff;
}

.education-article-content a {
  color: #8ab4ff;
}

.education-article-content img {
  max-width: 100%;
  height: auto;
  border-radius: 10px;
}

.education-article-footer {
  border-top: 1px solid #292929;
  margin-top: 45px;
  padding-top: 22px;
}

.education-article-footer a {
  color: #999;
  text-decoration: none;
}

.education-article-footer a:hover {
  color: #fff;
}

@media (max-width: 600px) {
  .education-article {
    padding: 20px 18px 60px;
  }

  .education-article-header h1 {
    font-size: 30px;
  }

  .education-article-content {
    font-size: 15px;
  }
}
</style>
